/* respostas */

input[type=text],input[type=tel],input[type=email]{width:100%;min-height:58px;padding:0 64px 0 18px;border:1px solid var(--tan);border-radius:16px;background:#fff;font:400 1.05rem var(--sans);color:var(--ink)}

<script>
(function(){
'use strict';

/* ===== CONFIGURAÇÃO ===== */
const WEBHOOK_URL = 'https://webhook.kvgroupbr.com.br/webhook/trabalhista';
const PIXEL_ID    = '1385665022550986';   // só números; deixe como está para desativar o Pixel
const TIMEOUT_MS  = 10000;                     // tempo máximo por tentativa de envio
const TENTATIVAS  = 3;                         // tentativas automáticas antes de mostrar erro
const WHATSAPP_ESCRITORIO = '5592984812939';   // só dígitos com 55+DDD. Ex.: 5592999999999 (número que enviará a mensagem automática)
const AVATAR      = 'avatar-dr-marcelo.webp';  // foto redonda do Dr. Marcelo nos balões (troque o arquivo para trocar a foto)
const TYPING_MS   = 550;                       // duração do "digitando…" entre mensagens

const pixelOn   = /^\d{8,20}$/.test(PIXEL_ID);
const webhookOn = /^https?:\/\//.test(WEBHOOK_URL);

/* ===== PIXEL (só carrega se PIXEL_ID válido) ===== */
if (pixelOn) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
}
const track = (ev, data, opts) => { if (pixelOn && window.fbq) fbq('track', ev, data || {}, opts || {}); };

const trackCustom = (ev, data, opts) => { if (pixelOn && window.fbq) fbq('trackCustom', ev, data || {}, opts || {}); };
/* Eventos de progresso: Diagnostico10, Diagnostico25, Diagnostico50, Diagnostico75 (uma vez cada, ao atingir % da barra).
   Meta não aceita "%" no nome do evento. eventID = <id da visita>_<evento>, para deduplicar com a CAPI. */
const fired = new Set(); let sid = null;
function trackProgress(pct){
  [10, 25, 50, 75].forEach(t => {
    if (pct < t || fired.has(t)) return;
    fired.add(t); sid = sid || uuid();
    trackCustom('Diagnostico' + t, {progresso: t}, {eventID: sid + '_Diagnostico' + t});
  });
}

/* ===== PERGUNTAS =====
   opts: [valor, rótulo]. skip(a): pula a pergunta conforme respostas já dadas. */
const Q = [
 {id:'situacao', label:'Situação atual', title:'Qual é a sua situação hoje em relação à empresa?', opts:[
   ['demitido','Fui demitido(a)'],['pedi_demissao','Pedi demissão'],['acordo','Saí por acordo com a empresa'],
   ['saiu_nao_sabe','Saí, mas não sei bem como ficou'],['ainda_trabalha','Ainda trabalho na empresa']]},
 {id:'tempo_saida', label:'Tempo desde a saída da empresa', title:'Há quanto tempo você saiu da empresa?',
  hint:'O prazo geral para ajuizar ação trabalhista é de 2 anos após o fim do contrato.',
  skip:a=>a.situacao==='ainda_trabalha', opts:[
   ['ate6m','Há menos de 6 meses'],['6m_1a','Entre 6 meses e 1 ano'],['1a_2a','Entre 1 e 2 anos'],['mais2a','Há mais de 2 anos']]},
 {id:'vinculo', label:'Tipo de vínculo', title:'Como era a sua relação de trabalho?', opts:[
   ['clt','Carteira assinada (CLT)'],['sem_carteira','Trabalhava sem carteira assinada'],['pj','Como PJ / prestador de serviço'],
   ['terceirizado','Terceirizado(a)'],['domestico','Trabalho doméstico']]},
 {id:'tempo_empresa', label:'Tempo de trabalho na empresa', title:'Por quanto tempo você trabalhou nessa empresa?', opts:[
   ['menos6m','Menos de 6 meses'],['6m_1a','De 6 meses a 1 ano'],['1a_3a','De 1 a 3 anos'],['3a_5a','De 3 a 5 anos'],['mais5a','Mais de 5 anos']]},
 {id:'problemas', label:'Situações ocorridas', multi:true, exclusive:'nao_sei', title:'O que aconteceu durante ou ao final do contrato?',
  hint:'Marque tudo o que se aplica.', opts:[
   ['horas_extras','Horas extras sem pagamento'],['fgts','FGTS não depositado'],['rescisao_errada','Rescisão com cálculo errado'],
   ['sem_registro','Trabalho sem registro em carteira'],['desvio_funcao','Acúmulo ou desvio de função'],['assedio','Assédio moral'],
   ['adicionais','Adicional noturno, insalubridade ou periculosidade'],['ferias_13','Férias ou 13º não pagos'],
   ['verbas','Outras verbas não pagas'],['nao_sei','Não sei / quero entender melhor']]},
 {id:'salario', label:'Faixa salarial', title:'Qual era, aproximadamente, o seu salário mensal?', opts:[
   ['ate2k','Até R$ 2.000'],['2k_4k','De R$ 2.000 a R$ 4.000'],['4k_7k','De R$ 4.000 a R$ 7.000'],['mais7k','Acima de R$ 7.000'],['nd','Prefiro não informar']]},
 {id:'rescisao', label:'Rescisão e documentos assinados', title:'Você recebeu a rescisão ou assinou algum documento na saída?',
  skip:a=>a.situacao==='ainda_trabalha', opts:[
   ['recebi_assinei','Recebi e assinei o termo de rescisão'],['recebi_sem_entender','Recebi valores, mas não entendi o cálculo'],
   ['assinei_nao_recebi','Assinei, mas não recebi tudo'],['nao_recebi','Não recebi nada'],['nao_lembro','Não me lembro']]},
 {id:'advogado', label:'Advogado ou ação anterior', title:'Você já consultou outro advogado ou entrou com ação sobre esse caso?', opts:[
   ['nao','Não, ainda não'],['consultou','Já conversei com um advogado, sem ação'],['acao_andamento','Sim, há uma ação em andamento'],['acao_encerrada','Sim, a ação já foi encerrada']]},
 {id:'documentos', label:'Documentos disponíveis', multi:true, exclusive:'nenhum', title:'Quais documentos você possui?',
  hint:'Marque tudo o que tiver. Não é necessário enviá-los agora.', opts:[
   ['carteira','Carteira de trabalho'],['holerites','Holerites / contracheques'],['trct','Termo de rescisão (TRCT)'],
   ['fgts','Extrato do FGTS'],['mensagens','Mensagens, e-mails ou registros de ponto'],['nenhum','Não tenho nenhum no momento']]}
];
const R = {}; // id -> {valor: rótulo} (para montar respostas legíveis)
Q.forEach(q => { R[q.id] = {}; q.opts.forEach(o => R[q.id][o[0]] = o[1]); });

/* ===== QUALIFICAÇÃO =====
   Pontuação 0-100 por regras simples. O prazo prescricional (2 anos) é regra eliminatória:
   quem saiu há mais de 2 anos vira "fora_do_prazo", independentemente do score.
   Quente >= 65 | Morno >= 40 | Frio < 40. Ação em andamento pesa muito (outro advogado já atua). */
const PTS = {
  tempo_saida:{ate6m:25,'6m_1a':20,'1a_2a':10,mais2a:0},
  vinculo:{clt:15,sem_carteira:15,terceirizado:12,domestico:10,pj:8},
  tempo_empresa:{menos6m:2,'6m_1a':5,'1a_3a':10,'3a_5a':13,mais5a:15},
  advogado:{nao:5,consultou:0,acao_andamento:-30,acao_encerrada:-10},
  rescisao:{recebi_assinei:0,recebi_sem_entender:5,assinei_nao_recebi:6,nao_recebi:8,nao_lembro:2}
};
function qualificar(a){
  let s = 0;
  ['tempo_saida','vinculo','tempo_empresa','advogado','rescisao'].forEach(k => { s += (PTS[k][a[k]]) || 0; });
  if (a.situacao === 'ainda_trabalha') s += 10;                     // contrato vigente: prazo ainda não começou a correr
  const prob = (a.problemas || []).filter(p => p !== 'nao_sei');
  s += Math.min(prob.length, 4) * 5;                                // até 20 pts por situações concretas relatadas
  if ((a.problemas || []).includes('nao_sei') && !prob.length) s += 3;
  const docs = (a.documentos || []).filter(d => d !== 'nenhum');
  s += Math.min(docs.length, 5) * 2;                                // até 10 pts por documentos
  s = Math.max(0, Math.min(100, s));
  const flags = [];
  if (a.tempo_saida === '1a_2a') flags.push('prazo_proximo');
  if (a.advogado === 'acao_andamento') flags.push('acao_em_andamento');
  if (a.tempo_saida === 'mais2a') flags.push('fora_do_prazo');
  const classificacao = a.tempo_saida === 'mais2a' ? 'fora_do_prazo' : s >= 65 ? 'quente' : s >= 40 ? 'morno' : 'frio';
  return {score:s, classificacao, flags};
}

/* ===== FLUXO (estilo conversa) =====
   steps = [início, perguntas aplicáveis..., nome, whatsapp, consentimento]
   pos = quantas etapas já foram respondidas. */
const INTRO = [
  'Olá! Esta é a análise informativa do escritório do Dr. Marcelo Melo, advogado trabalhista.',
  'Se você saiu da empresa sem entender o que recebeu, ela é para você. O prazo para buscar direitos trabalhistas, em regra, é de <b>2 anos após a saída</b>. São algumas perguntas rápidas, leva menos de 1 minuto.'
];
const FORM = [
  {type:'nome',   say:'Perfeito. Para começar, qual é o seu nome completo?'},
  {type:'whats',  say:'Qual é o seu WhatsApp com DDD? É por ele que a equipe do Dr. Marcelo fará o contato.'},
  {type:'consent'}
];
const $ = id => document.getElementById(id);
const ans = {};                         // id -> valor | [valores]
const D = {nome:'', whats:''};
const G = {cidade:'', estado:'', pais:'', pais_codigo:'', ip:''};   // localização aproximada por IP (preenchida em segundo plano)
let pos = 0, typing = false, done = false, shown = 0;
let eventId = null;                     // gerado uma única vez por lead (reutilizado nos retries e no Pixel)
let sending = false;

const applicable = () => Q.filter(q => !(q.skip && q.skip(ans)));
const steps = () => [{type:'start'}].concat(applicable().map(q => ({type:'q', q})), FORM);
const sayOf = s => s.type === 'q' ? s.q.title
  : s.type === 'consent' ? 'Última etapa. Para enviar sua análise, preciso do seu consentimento.' : s.say;

/* ===== LOCALIZAÇÃO POR IP (aproximada) =====
   Só roda DEPOIS do consentimento (checkbox marcado) e o texto do consentimento informa a coleta.
   Serviço de terceiros (ipwho.is). Se falhar ou for bloqueado, segue sem localização.
   ponytail: troque por geo no n8n (IP da requisição) se precisar de mais garantia. */
let geoP = null;
function geoLookup(){
  if (geoP) return geoP;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 4000);
  geoP = fetch('https://ipwho.is/?fields=success,ip,city,region,country,country_code', {signal: ctl.signal})
    .then(r => r.json()).then(j => { if (j && j.success) Object.assign(G, {cidade:j.city||'', estado:j.region||'', pais:j.country||'', pais_codigo:j.country_code||'', ip:j.ip||''}); })
    .catch(() => {}).finally(() => clearTimeout(to));
  return geoP;
}

/* ===== MÁSCARA / VALIDAÇÃO ===== */
const digits = s => s.replace(/\D/g, '');
function maskPhone(v){
  const d = digits(v).slice(0, 11);
  if (d.length > 6) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length > 2) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  return d ? `(${d}` : '';
}
// 11 dígitos: DDD (11-99, sem 0) + celular iniciando em 9; rejeita sequências repetidas (ex.: 999999999)
const phoneOk = v => { const d = digits(v); return /^[1-9][1-9]9\d{8}$/.test(d) && !/^(\d)\1+$/.test(d.slice(2)); };
const nameOk = v => v.split(/\s+/).length >= 2 && v.length >= 5;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== RENDER ===== */
function display(s){
  if (s.type === 'start') return 'Iniciar análise gratuita';
  if (s.type === 'q') { const v = ans[s.q.id]; return Array.isArray(v) ? v.map(x => R[s.q.id][x]).join(', ') : R[s.q.id][v]; }
  if (s.type === 'nome') return D.nome;
  if (s.type === 'whats') return D.whats;
  return 'Concordo e autorizo o contato por WhatsApp';
}

function render(){
  const flow = steps(), chat = $('chat');
  let idx = 0, html = '', lastBot = -1;
  const row = (cls, inner) => { const pop = idx++ >= shown ? ' pop' : ''; return `<div class="m ${cls}${pop}">${inner}</div>`; };
  const bot = (t, id) => { lastBot = idx; return row('bot', `<img class="av" src="${AVATAR}" alt="" width="40" height="40"><div class="b"${id ? ` id="${id}"` : ''}>${t}</div>`); };
  const me = t => row('me', `<div class="b">${esc(t)}</div>`);

  for (let i = 0; i < Math.min(pos, flow.length); i++) {
    const s = flow[i];
    if (s.type === 'start') INTRO.forEach(t => { html += bot(t); });
    else html += bot(sayOf(s) + (s.type === 'q' && s.q.hint ? `<small>${s.q.hint}</small>` : ''));
    html += me(display(s));
  }
  let widget = '', say = '';
  if (done) {
    const nome = D.nome.split(' ')[0];
    const c = qualificar(ans).classificacao;
    const note = c === 'fora_do_prazo'
      ? 'Como a saída ocorreu há mais de 2 anos, o prazo geral para ação trabalhista pode ter se encerrado. A equipe verificará, com transparência, se há alguma situação específica a ser analisada. Não é possível garantir qualquer resultado.'
      : 'Esta análise é informativa e não garante resultado. Cada caso depende de suas circunstâncias e das provas disponíveis.';
    [`Recebemos suas informações, ${esc(nome)}.`,
     '<b>Verifique seu WhatsApp para continuar seu atendimento.</b> Você receberá uma mensagem do escritório do Dr. Marcelo Melo em instantes.',
     note
    ].forEach((t, i) => { html += bot(t, i === 0 ? 'cur' : ''); });
    const num = digits(WHATSAPP_ESCRITORIO), txt = encodeURIComponent('Olá! Acabei de preencher a análise informativa do meu caso.');
    widget = `<a class="btn" href="https://wa.me/${num.length >= 12 ? num : ''}?text=${txt}" target="_blank" rel="noopener">Abrir WhatsApp</a>`;
    say = 'Recebemos suas informações.';
  } else if (typing) {
    html += `<div class="m bot"><img class="av" src="${AVATAR}" alt="" width="40" height="40"><div class="b typing" aria-hidden="true"><i></i><i></i><i></i></div></div>`;
  } else {
    const s = flow[pos];
    if (s.type === 'start') INTRO.forEach((t, i) => { html += bot(t, i === 0 ? 'cur' : ''); }), say = INTRO.join(' ').replace(/<[^>]+>/g, '');
    else {
      let t = sayOf(s);
      if (s.type === 'q' && s.q.hint) t += `<small>${s.q.hint}</small>`;
      if (s.type === 'consent' && ans.tempo_saida === 'mais2a') t += '<small>Pelas suas respostas, a saída ocorreu há mais de 2 anos, o que em regra ultrapassa o prazo para ação trabalhista. Ainda assim, a equipe poderá analisar se há alguma exceção aplicável, sem garantia de resultado.</small>';
      html += bot(t, 'cur'); say = sayOf(s);
    }
    widget = widgetHTML(s);
  }
  shown = idx;
  chat.innerHTML = html + (widget ? `<div class="w${!done && flow[pos].type === 'q' && flow[pos].q.multi ? ' multi' : ''}" id="w" tabindex="-1" aria-labelledby="cur" role="group">${widget}</div>` : '');
  if (say) $('sr').textContent = say;
  progress(flow);
  if (widget && !done) bindWidget(flow[pos]);
  const target = chat.querySelector('#cur') || chat.lastElementChild;
  const el = target && (target.closest('.m') || target);
  if (el && (typing || pos > 0 || done)) el.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
}

function progress(flow){
  const n = flow.length - 1, d = done ? n : Math.max(0, Math.min(pos - 1, n));
  $('segs').innerHTML = Array.from({length:n}, (_, i) => `<i class="${i < d ? 'on' : ''}"></i>`).join('');
  $('segs').setAttribute('aria-valuenow', Math.round(d / n * 100));
  if (!done) trackProgress(Math.round(d / n * 100));
  $('cnt').textContent = d; $('tot').textContent = n;
}

const backBtn = () => pos > 0 ? '<button type="button" class="link back" data-back>← Voltar</button>' : '';
function widgetHTML(s){
  if (s.type === 'start') return '<button type="button" class="btn" data-start>Iniciar análise gratuita</button>';
  if (s.type === 'q') {
    const sel = ans[s.q.id] || (s.q.multi ? [] : null);
    return s.q.opts.map(([v, l]) => `<button type="button" class="opt" data-v="${v}" aria-pressed="${s.q.multi ? sel.includes(v) : sel === v}"><span class="dot" aria-hidden="true"></span><span>${l}</span></button>`).join('')
      + (s.q.multi ? '<button type="button" class="btn" data-next>Continuar</button><p class="err" id="e" role="alert"></p>' : '') + backBtn();
  }
  if (s.type === 'nome') return `<p class="lbl">Seu nome</p><form class="ask" novalidate><input type="text" id="f" autocomplete="name" placeholder="Nome e sobrenome" aria-label="Seu nome completo" aria-describedby="e" value="${esc(D.nome)}"><button class="go" aria-label="Enviar">↑</button></form><p class="err" id="e" role="alert"></p>${backBtn()}`;
  if (s.type === 'whats') return `<p class="lbl">Seu WhatsApp</p><form class="ask" novalidate><input type="tel" id="f" inputmode="numeric" autocomplete="tel-national" placeholder="(11) 91234-5678" maxlength="15" aria-label="WhatsApp com DDD" aria-describedby="e" value="${esc(D.whats)}"><button class="go" aria-label="Enviar">↑</button></form><p class="err" id="e" role="alert"></p>${backBtn()}`;
  return `<form class="w" novalidate><label class="consent"><input type="checkbox" id="f" aria-describedby="e"><span>Li e concordo com o tratamento dos meus dados pessoais para fins de análise do meu caso e autorizo o contato por <b>WhatsApp</b> pelo Dr. Marcelo Melo ou sua equipe, conforme a <a href="#politica-de-privacidade" target="_blank" rel="noopener">Política de Privacidade</a> (LGPD). Autorizo também o registro da minha localização aproximada (cidade, estado e país) e do meu IP.</span></label><p class="err" id="e" role="alert"></p><div class="banner" id="net" role="alert" hidden></div><button class="btn" id="send">Receber minha análise</button></form>${backBtn()}`;
}

function bindWidget(s){
  const w = $('w');
  w.querySelectorAll('[data-back]').forEach(b => b.onclick = back);
  const f = $('f');
  if (s.type === 'start') w.querySelector('[data-start]').onclick = () => { track('ViewContent', {content_name:'Quiz Trabalhista - início'}); go(pos + 1); };
  else if (s.type === 'q') {
    w.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(s.q, b.dataset.v, w, b));
    const nx = w.querySelector('[data-next]');
    if (nx) nx.onclick = () => { if (!(ans[s.q.id] || []).length) { $('e').textContent = 'Selecione ao menos uma opção.'; return; } go(pos + 1); };
  } else if (s.type === 'nome' || s.type === 'whats') {
    if (s.type === 'whats') f.addEventListener('input', () => { f.value = maskPhone(f.value); });
    w.querySelector('form').onsubmit = e => {
      e.preventDefault();
      const v = f.value.trim().replace(/\s+/g, ' ');
      const ok = s.type === 'nome' ? nameOk(v) : phoneOk(v);
      f.setAttribute('aria-invalid', !ok);
      $('e').textContent = ok ? '' : s.type === 'nome' ? 'Informe seu nome completo.' : 'Informe um WhatsApp válido com DDD. Ex.: (11) 91234-5678.';
      if (!ok) return f.focus();
      D[s.type === 'nome' ? 'nome' : 'whats'] = v; go(pos + 1);
    };
  } else { f.addEventListener('change', () => { if (f.checked) geoLookup(); }); w.onsubmit = submit; }
  (f && s.type !== 'consent' ? f : w).focus({preventScroll:true});
}

function pick(q, v, w, btn){
  if (!q.multi) {
    ans[q.id] = v;
    Q.forEach(x => { if (x.skip && x.skip(ans)) delete ans[x.id]; });   // descarta respostas de perguntas que viraram "puladas"
    go(pos + 1);                                                        // avanço automático
    return;
  }
  const cur = ans[q.id] || [];
  let a = cur.filter(x => x !== q.exclusive);
  if (v === q.exclusive) a = cur.includes(v) ? [] : [v];
  else a = a.includes(v) ? a.filter(x => x !== v) : a.concat(v);
  ans[q.id] = a;
  w.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', a.includes(b.dataset.v)));
  $('e').textContent = '';
}

function go(n){
  pos = n; typing = true; render();
  setTimeout(() => { typing = false; render(); }, TYPING_MS);
}
function back(){
  if (typing || sending || pos === 0) return;
  pos--; shown = 1e9; render();
}

/* ===== PAYLOAD ===== */
const cookie = n => (document.cookie.match('(?:^|; )' + n + '=([^;]*)') || [])[1] || '';
function trackingParams(){
  const p = new URLSearchParams(location.search), out = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id','fbclid'].forEach(k => {
    let v = p.get(k);
    try { if (v) sessionStorage.setItem(k, v); else v = sessionStorage.getItem(k); } catch(e){}   // preserva se o usuário recarregar
    out[k] = v || '';
  });
  return out;
}
const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });

function respostasLegiveis(){
  const out = {};
  applicable().forEach(q => {
    const v = ans[q.id];
    out[q.label] = Array.isArray(v) ? v.map(x => R[q.id][x]) : R[q.id][v];
  });
  return out;
}
function resumo(nome, qual, resp, cidade){
  const lines = ['Novo lead - análise trabalhista', `Nome: ${nome}`, `Classificação: ${qual.classificacao.toUpperCase()} (score ${qual.score}/100)`];
  if (qual.flags.length) lines.push(`Alertas: ${qual.flags.join(', ')}`);
  Object.keys(resp).forEach(k => lines.push(`${k}: ${Array.isArray(resp[k]) ? resp[k].join('; ') : resp[k]}`));
  if (cidade) lines.push(`Local (por IP): ${cidade}${G.estado ? '/' + G.estado : ''}${G.pais ? ' - ' + G.pais : ''}`);
  return lines.join('\n');
}
/* ===== PAYLOAD PARA A CONVERSIONS API (campo "capi") =====
   Só é hasheado (SHA-256, minúsculo/sem espaços) o que a Meta exige: ph, fn, ln, country (e em, se houver e-mail).
   NÃO hasheados: external_id, client_ip_address, client_user_agent, fbc, fbp (a Meta pede esses em texto puro).
   Campos vazios são omitidos. Se o navegador não tiver crypto.subtle (página fora de HTTPS), capi = null. */
async function sha256(v){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function externalId(){
  try { let x = localStorage.getItem('kv_xid'); if (!x) { x = uuid(); localStorage.setItem('kv_xid', x); } return x; } catch(e) { return eventId; }
}
async function buildCapi(p){
  if (!(window.crypto && crypto.subtle)) { console.warn('[quiz] sem crypto.subtle: capi omitido'); return null; }
  const clean = v => (v || '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const parts = p.nome.trim().split(/\s+/);
  const country = clean(p.pais_codigo) || (p.whatsapp.startsWith('55') ? 'br' : '');   // fallback: DDI do WhatsApp
  const hashed = {ph: p.whatsapp, fn: clean(parts[0]), ln: parts.length > 1 ? clean(parts[parts.length - 1]) : '', country, em: (p.email || '').trim().toLowerCase()};
  const ud = {};
  for (const k of Object.keys(hashed)) if (hashed[k]) ud[k] = [await sha256(hashed[k])];
  ud.external_id = [externalId()];
  if (p.ip) ud.client_ip_address = p.ip;
  ud.client_user_agent = p.user_agent;
  if (p.fbc) ud.fbc = p.fbc;
  if (p.fbp) ud.fbp = p.fbp;
  const cd = {content_name: 'Quiz Trabalhista', content_category: p.classificacao};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id'].forEach(k => { if (p[k]) cd[k] = p[k]; });
  const time = Math.floor(Date.now() / 1000);
  // Lead e LeadDiagnostico compartilham o mesmo event_id, igual ao que o Pixel dispara (deduplicação por nome+id)
  return {data: ['Lead', 'LeadDiagnostico'].map(event_name => ({
    event_name, event_time: time, event_id: p.event_id, action_source: 'website', event_source_url: p.url,
    user_data: ud, custom_data: cd
  }))};
}

async function buildPayload(){
  const nome = D.nome, cidade = G.cidade;
  const qual = qualificar(ans), resp = respostasLegiveis();
  const t = trackingParams();
  const fbc = cookie('_fbc') || (t.fbclid ? `fb.1.${Date.now()}.${t.fbclid}` : '');
  const p = Object.assign({
    nome, whatsapp: '55' + digits(D.whats), email: '', cidade, estado: G.estado, pais: G.pais, pais_codigo: G.pais_codigo, ip: G.ip,   // email mantido vazio por compatibilidade
    respostas: resp, score: qual.score, classificacao: qual.classificacao, alertas: qual.flags,
    acao_em_andamento: ans.advogado === 'acao_andamento',
    resumo_texto: resumo(nome, qual, resp, cidade)
  }, t, {
    fbp: cookie('_fbp'), fbc,
    url: location.href, user_agent: navigator.userAgent,
    timestamp: new Date().toISOString(), event_id: eventId
  });
  p.capi = await buildCapi(p);
  return p;
}

/* ===== ENVIO (timeout + retry, sem perder dados) ===== */
async function post(payload){
  let err;
  for (let i = 0; i < TENTATIVAS; i++) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch(WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), signal: ctl.signal});
      if (r.ok) return;
      err = new Error('HTTP ' + r.status);
    } catch (e) { err = e; }
    finally { clearTimeout(to); }
    if (i < TENTATIVAS - 1) await new Promise(res => setTimeout(res, 1000 * (i + 1)));
  }
  throw err;
}

async function submit(e){
  e.preventDefault();
  if (sending || done) return;                         // bloqueia duplo clique
  $('net').hidden = true;
  const f = $('f');
  f.setAttribute('aria-invalid', !f.checked);
  $('e').textContent = f.checked ? '' : 'Para continuar, é necessário concordar com o tratamento dos dados e o contato por WhatsApp.';
  if (!f.checked) return f.focus();
  sending = true;
  const btn = $('send'); btn.disabled = true; btn.textContent = 'Enviando…'; $('w').setAttribute('aria-busy','true');
  eventId = eventId || uuid();
  await geoLookup();                                   // só após o consentimento
  const payload = await buildPayload();
  try {
    if (!webhookOn) throw new Error('WEBHOOK_URL não configurada');
    await post(payload);
    done = true; sending = false;
    track('Lead', {content_name:'Quiz Trabalhista', content_category: payload.classificacao}, {eventID: eventId});
    trackCustom('LeadDiagnostico', {content_name:'Quiz Trabalhista', content_category: payload.classificacao}, {eventID: eventId});
    pos = steps().length; typing = true; render();
    setTimeout(() => { typing = false; render(); }, TYPING_MS);
  } catch (err) {
    sending = false;
    console.error('[quiz] falha no envio', err);
    const b = $('net');
    b.textContent = 'Não conseguimos enviar agora. Seus dados foram mantidos: confira sua conexão e tente novamente.';
    b.hidden = false;
    btn.disabled = false; btn.textContent = 'Tentar novamente'; $('w').removeAttribute('aria-busy');
  }
}

render();
})();
